name: Bug report
description: Report a reproducible portfolio defect without private information.
title: "[Bug]: "
body:
  - type: textarea
    id: problem
    attributes: { label: Problem, description: What happened and on which page? }
    validations: { required: true }
  - type: textarea
    id: reproduce
    attributes: { label: Reproduction, description: Steps, browser, device, and expected behavior. }
    validations: { required: true }
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I did not include private career sources, contact data, credentials, or confidential employer information.
          required: true
